<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>小橘抖音</title>
<meta name="apple-mobile-web-app-title" content="小橘抖音" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" sizes="192x192" href="xjdy-192.png" />
<link rel="shortcut icon" href="xjdy-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="xjdy-180.png" />
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="xjdy-180.png" />
<link rel="manifest" href="xjdy.webmanifest" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--accent:#fe2c55;--accent2:#25f4ee;--dim:rgba(255,255,255,.65)}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* 顶部：中间「推荐 / 最新」，左边在线状态，右边搜索 —— 照抖音 */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));pointer-events:none}
  .topbar > *{pointer-events:auto}
  .tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:22px;font-size:17px;font-weight:600}
  .tab{color:var(--dim);padding:4px 0;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .tab.on{color:#fff}
  .tab.on::after{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:#fff}
  .api-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
  .icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}

  /* 搜索页：点放大镜才出来 */
  .search-page{position:fixed;inset:0;z-index:90;background:#111;display:none;flex-direction:column;
    padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top))}
  .search-page.show{display:flex}
  .search-row{display:flex;align-items:center;gap:10px}
  .search-box{flex:1;display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:8px;padding:9px 12px}
  .search-box input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:15px}
  .search-go{color:var(--accent);font-size:15px;font-weight:600}
  .search-hint{margin-top:18px;font-size:13px;color:#888}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .chip{font-size:13px;color:#ddd;background:#222;border-radius:999px;padding:6px 12px}

  /* 上下翻：交给浏览器原生滚动 + 吸附（参考 GitHub 上的 doomscroller）。手指拖动、惯性、吸附都由浏览器做，
     苹果手机上在系统的滚动线程里跑，页面 JS 再忙也不掉帧；snap-stop:always 让甩得再猛也只翻一条，跟抖音一样。
     第一条往下拉不回弹（overscroll none），留给下拉刷新；离得远的视频只留个黑底，里面的东西不画 */
  .feed{position:fixed;inset:0;overflow-x:hidden;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:none;touch-action:pan-y;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .slide{position:relative;height:100%;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
  .slide:not(.near) > *{display:none}

  /* 抖音的加载动画：青、红两个点来回交换，叠在一起的地方变暗 */
  .dy-loader{position:relative;width:34px;height:12px;isolation:isolate}
  .dy-loader i{position:absolute;top:0;left:11px;width:12px;height:12px;border-radius:50%;mix-blend-mode:multiply}
  .dy-loader i:first-child{background:#25f4ee;transform:translateX(-9px)}
  .dy-loader i:last-child{background:#fe2c55;transform:translateX(9px)}
  .dy-loader.spin i:first-child{animation:dyA .4s ease-in-out infinite alternate}
  .dy-loader.spin i:last-child{animation:dyB .4s ease-in-out infinite alternate}
  @keyframes dyA{from{transform:translateX(-9px) scale(1)}to{transform:translateX(9px) scale(1.2)}}
  @keyframes dyB{from{transform:translateX(9px) scale(1)}to{transform:translateX(-9px) scale(1.2)}}

  /* 下拉刷新（抖音首页）：第一条往下拉时视频不动，整条顶栏跟着手指往下走、淡出，
     「下拉刷新内容」淡入；松手刷新时顶栏回原位，右上角的搜索换成两个点在转 */
  .pull-notice{position:fixed;top:0;left:0;right:0;z-index:49;display:flex;justify-content:center;
    padding-top:calc(max(10px, env(safe-area-inset-top)) + 14px);font-size:16px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:0;pointer-events:none}
  .top-loading{width:36px;height:36px;display:none;align-items:center;justify-content:center}
  body.refreshing #searchOpen{display:none}
  body.refreshing .top-loading{display:flex}
  /* 视频卡住在缓冲：进度条位置一根白线从中间往两边散开 */
  .buffer-line{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));height:2px;z-index:7;overflow:hidden;display:none;pointer-events:none}
  .slide.no-related .buffer-line{bottom:env(safe-area-inset-bottom)}
  .buffer-line::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;transform:scaleX(0);animation:bufLine .9s ease-out infinite}
  @keyframes bufLine{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:0}}
  .slide.waiting .buffer-line{display:block}
  .slide.waiting .progress-track{opacity:0}
  .video-wrap{position:absolute;inset:0}
  .video-wrap video,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
  .poster{transition:opacity .4s}
  .shade-top{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);pointer-events:none}
  .shade-bottom{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);pointer-events:none}

  /* 右边一列：头像、赞、评论、收藏、声音、分享 */
  .actions{position:absolute;right:8px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px}
  .act{display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
  .act svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));transition:transform .15s}
  .act:active svg{transform:scale(.88)}
  .act-label{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .act.on .heart path{fill:var(--accent);stroke:var(--accent)}
  .act.on .star path{fill:#ffc300;stroke:#ffc300}
  .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;position:relative;margin-bottom:8px}
  .follow-plus{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1}

  /* 左下：@作者、文案（#话题高亮，可点） */
  .info{position:absolute;left:0;right:76px;bottom:calc(46px + env(safe-area-inset-bottom));z-index:5;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
  .author{font-size:16px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);align-self:flex-start}
  .caption{font-size:14px;line-height:1.45;text-shadow:0 1px 3px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .caption.expanded{-webkit-line-clamp:unset}
  .caption .tag{font-weight:600}
  .more{font-size:13px;font-weight:600;color:var(--dim);align-self:flex-start}
  .meta{font-size:12px;color:var(--dim)}

  .progress-wrap{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));height:14px;z-index:7;display:flex;align-items:flex-end;cursor:pointer}
  .progress-track{width:100%;height:2px;background:rgba(255,255,255,.25)}
  .progress-bar{height:100%;width:0%;background:rgba(255,255,255,.85)}
  .slide.no-related .progress-wrap{bottom:env(safe-area-inset-bottom)}
  .slide.no-related .info{bottom:calc(10px + env(safe-area-inset-bottom))}
  .slide.no-related .actions{bottom:calc(84px + env(safe-area-inset-bottom))}
  .time-tip{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;font-size:22px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);display:none}
  .time-tip.show{display:block}

  .play-indicator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
  .play-indicator.show{opacity:.85}
  .heart-burst{position:absolute;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:20;opacity:0}
  .heart-burst.animate{animation:heartPop .8s cubic-bezier(.17,.89,.32,1.49) forwards}
  @keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-15deg);opacity:0}15%{opacity:1}35%{transform:translate(-50%,-50%) scale(1.15) rotate(-15deg)}100%{transform:translate(-50%,-80%) scale(1.3) rotate(-15deg);opacity:0}}
  .slide-error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.6);font-size:13px}
  .slide-error.show{display:block}
  .status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);z-index:40;text-align:center;padding:24px}

  /* 清屏：左滑把按钮和文字都藏起来，右滑恢复 */
  body.clean .topbar,body.clean .actions,body.clean .info,body.clean .shade-top,body.clean .shade-bottom{opacity:0;pointer-events:none}
  .topbar,.actions,.info{transition:opacity .25s}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:95;padding:9px 16px;border-radius:8px;background:rgba(0,0,0,.75);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  .search-banner{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:8px;
    background:rgba(0,0,0,.55);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;max-width:86vw}
  .search-banner.show{display:flex}
  .search-banner span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .search-banner button{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
  @media (min-width:768px){.video-wrap video,.poster{object-fit:contain}}
</style>
</head>
<body>

<div class="topbar">
  <div class="api-badge" id="apiBadge" title="点一下切换 Worker 地址"><span class="dot" id="apiDot"></span><span id="apiStatus">连接中</span></div>
  <div class="tabs">
    <button class="tab on" data-mode="rec">推荐</button>
    <button class="tab" data-mode="new">最新</button>
  </div>
  <button class="icon-btn" id="searchOpen" aria-label="搜索"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <div class="top-loading"><div class="dy-loader spin"><i></i><i></i></div></div>
</div>
<div class="search-banner" id="searchBanner"><span id="searchBannerText"></span><button id="searchClear">清除</button></div>

<div class="search-page" id="searchPage">
  <div class="search-row">
    <button class="icon-btn" id="searchBack" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="qInput" placeholder="搜作者、文案、#话题" enterkeyhint="search" />
    </div>
    <button class="search-go" id="searchGo">搜索</button>
  </div>
  <div class="search-hint">最近搜过</div>
  <div class="chips" id="historyChips"></div>
</div>

<div class="pull-notice" id="pullNotice">下拉刷新内容</div>
<div class="feed" id="feed"></div>
<div class="toast" id="toast"></div>

<script>
/** 视频服务地址：页面就在视频服务上时用同一个地址；也可以 ?api=https://xxx.workers.dev 指定一次（会记住） */
const qs = new URLSearchParams(location.search);
if (qs.get('api')) localStorage.setItem('worker_base', qs.get('api').replace(/\/$/, ''));
const SAME_ORIGIN = /workers\.dev$/.test(location.hostname) ? location.origin : '';
const WORKER_BASE = (qs.get('api') || store('worker_base') || SAME_ORIGIN || 'https://xiaoju-shorts.langhua98.workers.dev').replace(/\/$/, '');

const API = {
  list: (offset, limit, q, seed) => `${WORKER_BASE}/api/list?offset=${offset}&limit=${limit}&q=${encodeURIComponent(q || '')}` + (seed == null ? '' : `&shuffle=1&seed=${seed}`),
  stream: (id) => `${WORKER_BASE}/stream/${id}.mp4`,
  thumb: (id) => `${WORKER_BASE}/thumb/${id}.jpg`,
  health: () => `${WORKER_BASE}/api/health`,
};

// 本机记的东西（点赞、收藏、搜索记录）：私密模式下读写会出错，出错就当没有
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k) || '';
    localStorage.setItem(k, v);
  } catch { return ''; }
}
function storeSet(k) { try { return new Set(JSON.parse(store(k) || '[]')); } catch { return new Set(); } }
const liked = storeSet('liked'), faved = storeSet('faved');
// 看过的视频：刷新时没看过的排前面，刷到的尽量是新视频
const seen = storeSet('seen');
let seenSaveTimer = null;
function markSeen(id) {
  id = String(id);
  if (seen.has(id)) return;
  seen.add(id);
  clearTimeout(seenSaveTimer);
  seenSaveTimer = setTimeout(() => store('seen', JSON.stringify([...seen].slice(-3000))), 1000);
}
function saveSet(k, s) { store(k, JSON.stringify([...s].slice(-2000))); }

let state = { offset: 0, limit: 20, total: 0, q: '', mode: 'rec', loading: false, items: [], seed: Math.floor(Math.random() * 1e9) };
const feed = document.getElementById('feed');
const qInput = document.getElementById('qInput');

// ── 声音：浏览器只让静音自动播，第一次碰屏幕时打开声音，之后都有声 ──
let soundOn = false, soundJustOn = 0;
const ICON = {
  sound: `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`,
  muted: `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="#fff"/><path d="m22 9-6 6M16 9l6 6"/></svg>`,
  heart: `<svg class="heart" width="38" height="38" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.1C13.8 6.2 15.3 5 17.4 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z" fill="#fff" stroke="#fff" stroke-width="1"/></svg>`,
  comment: `<svg width="36" height="36" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21.5l4-2c.9.2 1.9.3 3 .3 5.5 0 10-3.8 10-8.5S17.5 3 12 3z" fill="#fff"/><circle cx="8" cy="11.5" r="1.2" fill="#555"/><circle cx="12" cy="11.5" r="1.2" fill="#555"/><circle cx="16" cy="11.5" r="1.2" fill="#555"/></svg>`,
  star: `<svg class="star" width="36" height="36" viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9L12 2.8z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>`,
  share: `<svg width="36" height="36" viewBox="0 0 24 24"><path d="M14 4.5v4C7.5 9 4 13 3 19.5c2.6-3.4 5.8-5 11-5v4l7-7-7-7z" fill="#fff"/></svg>`,
};
function setMute(btn, muted) {
  btn.querySelector('.act-icon').innerHTML = muted ? ICON.muted : ICON.sound;
  btn.querySelector('.act-label').textContent = muted ? '静音' : '声音';
}
function enableSound() {
  if (soundOn) return;
  soundOn = true;
  soundJustOn = Date.now();  // 这一下只是开声音，不当成「点一下暂停」
  // 苹果手机只让「被手指碰过时 play 过」的播放器带声音自动播：趁这一下把池子里的三个都解锁
  // 解锁看的是「碰屏幕时调了 play」，跟当时静不静音无关：不在眼前的先静音着解锁，免得冒出一声
  POOL.forEach(v => {
    v.muted = v !== currentVideo;
    const p = v.play();
    if (p) p.then(() => { if (v !== currentVideo) v.pause(); }).catch(() => {});
  });
  document.querySelectorAll('.slide .mute-btn').forEach(b => setMute(b, false));
}
// 浏览器只认 touchend / pointerup / click / keydown 是「用户点过」，touchstart 不算，解锁不了声音
['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, enableSound, { passive: true }));

// ── 顶部：在线状态、推荐/最新、搜索 ──
const apiStatus = document.getElementById('apiStatus'), apiDot = document.getElementById('apiDot');
function setStatus(ok, text) {
  apiStatus.textContent = text;
  apiDot.style.background = ok ? '#25f4ee' : '#fe2c55';
  apiDot.style.boxShadow = `0 0 6px ${ok ? '#25f4ee' : '#fe2c55'}`;
}
document.getElementById('apiBadge').addEventListener('click', () => {
  const v = prompt('视频服务地址（https://xxx.workers.dev，留空用默认）', store('worker_base'));
  if (v === null) return;
  store('worker_base', v.trim().replace(/\/$/, ''));
  location.reload();
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if (t.dataset.mode === state.mode && !state.q) { refresh(); return; }  // 再点一下当前的「推荐/最新」= 刷新
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  state.mode = t.dataset.mode;
  state.seed = Math.floor(Math.random() * 1e9);
  loadMore(true);
}));

const searchPage = document.getElementById('searchPage');
function openSearch() { renderHistory(); searchPage.classList.add('show'); qInput.value = state.q; setTimeout(() => qInput.focus(), 50); }
function closeSearch() { searchPage.classList.remove('show'); qInput.blur(); }
function searchHistory() { try { return JSON.parse(store('search_history') || '[]'); } catch { return []; } }
function renderHistory() {
  const box = document.getElementById('historyChips');
  box.innerHTML = '';
  searchHistory().forEach(w => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = w;
    c.onclick = () => search(w);
    box.appendChild(c);
  });
}
function search(q) {
  q = String(q || '').trim();
  closeSearch();
  if (q) store('search_history', JSON.stringify([q, ...searchHistory().filter(x => x !== q)].slice(0, 12)));
  state.q = q;
  document.getElementById('searchBanner').classList.toggle('show', !!q);
  document.getElementById('searchBannerText').textContent = `搜索：${q}`;
  loadMore(true);
}
document.getElementById('searchOpen').onclick = openSearch;
document.getElementById('searchBack').onclick = closeSearch;
document.getElementById('searchGo').onclick = () => search(qInput.value);
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(qInput.value); });
document.getElementById('searchClear').onclick = () => search('');

// ── 工具 ──
const toastEl = document.getElementById('toast');
function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1300);
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtTime(s) { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function avatarColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 55% 42%)`;
}
// 文案：#话题 变成能点的高亮，点了按它搜；去掉末尾我们自己加的 #dy… / #ks… 编号
function captionHtml(text) {
  const clean = String(text || '').replace(/\s*#(dy|ks)[0-9A-Za-z_-]{6,}\s*$/, '').trim();
  return escapeHtml(clean).replace(/#([^\s#@]+)/g, (m, t) => `<span class="tag" data-q="#${t}">#${t}</span>`);
}

async function fetchList(offset, limit, q) {
  try {
    const seed = state.mode === 'rec' && !q ? state.seed : null;
    const res = await fetch(API.list(offset, limit, q, seed), { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items)) throw new Error('bad format');
    setStatus(true, '云在线');
    return data;
  } catch (e) {
    setStatus(false, '离线');
    throw e;
  }
}

function createSlide(item) {
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.id = item.id;
  const author = item.author || '小橘抖音';
  el.classList.add('no-related');
  const meta = [item.duration ? fmtTime(item.duration) : '', item.date ? String(item.date).slice(0, 10) : ''].filter(Boolean).join(' · ');
  const id = String(item.id);
  el.innerHTML = `
    <div class="video-wrap">
      <img class="poster" src="${API.thumb(item.id)}" alt="" loading="lazy" />
      <div class="shade-top"></div><div class="shade-bottom"></div>
    </div>
    <div class="slide-error">视频加载失败，轻点重试</div>
    <div class="play-indicator"><svg width="70" height="70" viewBox="0 0 24 24" fill="rgba(255,255,255,.85)"><path d="M8 5.14v14l11-7-11-7z"/></svg></div>
    <div class="heart-burst"><svg width="96" height="96" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.1C13.8 6.2 15.3 5 17.4 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z" fill="#fe2c55"/></svg></div>
    <div class="time-tip"></div>
    <div class="actions">
      <button class="act author-btn"><div class="avatar" style="background:${avatarColor(author)}">${escapeHtml([...author][0] || '橘')}<div class="follow-plus">+</div></div></button>
      <button class="act like-btn${liked.has(id) ? ' on' : ''}"><div class="act-icon">${ICON.heart}</div><div class="act-label">${liked.has(id) ? '已赞' : '赞'}</div></button>
      <button class="act comment-btn"><div class="act-icon">${ICON.comment}</div><div class="act-label">评论</div></button>
      <button class="act fav-btn${faved.has(id) ? ' on' : ''}"><div class="act-icon">${ICON.star}</div><div class="act-label">${faved.has(id) ? '已收藏' : '收藏'}</div></button>
      <button class="act mute-btn"><div class="act-icon"></div><div class="act-label">声音</div></button>
      <button class="act share-btn"><div class="act-icon">${ICON.share}</div><div class="act-label">分享</div></button>
    </div>
    <div class="info">
      <button class="author">@${escapeHtml(author)}</button>
      <div class="caption">${captionHtml(item.caption) || '&nbsp;'}</div>
      <button class="more" style="display:none">展开</button>
      ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ''}
    </div>
    <div class="progress-wrap"><div class="progress-track"><div class="progress-bar"></div></div></div>
    <div class="buffer-line"></div>
  `;

  const $ = s => el.querySelector(s);
  const poster = $('.poster'), bar = $('.progress-bar'), wrap = $('.progress-wrap');
  const vid = () => el._video;  // 这一页现在借着的播放器（不在眼前的页没有）
  const playInd = $('.play-indicator'), heart = $('.heart-burst'), timeTip = $('.time-tip');
  const likeBtn = $('.like-btn'), favBtn = $('.fav-btn'), muteBtn = $('.mute-btn'), caption = $('.caption'), more = $('.more');

  setMute(muteBtn, !soundOn);

  // 文案超过两行才出「展开」
  requestAnimationFrame(() => { if (caption.scrollHeight > caption.clientHeight + 2) more.style.display = ''; });
  more.onclick = e => { e.stopPropagation(); const x = caption.classList.toggle('expanded'); more.textContent = x ? '收起' : '展开'; };
  caption.addEventListener('click', e => {
    const t = e.target.closest('.tag');
    e.stopPropagation();
    if (t) search(t.dataset.q);
    else if (more.style.display !== 'none') more.click();
  });
  $('.author').onclick = e => { e.stopPropagation(); if (item.author) search(item.author); };
  $('.author-btn').onclick = e => { e.stopPropagation(); if (item.author) search(item.author); else toast('这条视频没有作者信息'); };

  el._on = {
    playing: () => { poster.style.opacity = '0'; el.classList.remove('waiting'); },
    waiting: v => { if (v === currentVideo) el.classList.add('waiting'); },
    canplay: () => { el.classList.remove('waiting'); },
    timeupdate: v => { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; },
  };

  // 第一次播放时视频服务要先去 Telegram 换文件号，偶尔超时或被限流：自动重试三次，再不行让人点一下
  const errBox = $('.slide-error');
  function reloadVideo() {
    errBox.classList.remove('show');
    const v = vid();
    if (!v) return;
    v.src = API.stream(item.id) + '?retry=' + Date.now();
    if (v === currentVideo) v.play().catch(() => {});
  }
  el._on.error = v => {
    const n = Number(el.dataset.retried || 0);
    if (n < 3) { el.dataset.retried = String(n + 1); setTimeout(() => { if (vid() === v) reloadVideo(); }, [2000, 8000, 20000][n]); }
    else { errBox.classList.add('show'); el.classList.remove('waiting'); }
  };
  errBox.addEventListener('click', e => { e.stopPropagation(); reloadVideo(); });

  // 进度条：点或拖，拖的时候中间显示时间
  function seekTo(clientX) {
    const r = wrap.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    const v = vid();
    if (!v || !v.duration) return;
    v.currentTime = p * v.duration;
    timeTip.textContent = `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
  }
  wrap.addEventListener('pointerdown', e => { e.stopPropagation(); timeTip.classList.add('show'); seekTo(e.clientX); wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e => { if (wrap.hasPointerCapture(e.pointerId)) seekTo(e.clientX); });
  wrap.addEventListener('pointerup', () => timeTip.classList.remove('show'));
  wrap.addEventListener('click', e => e.stopPropagation());

  // 单击暂停/播放，双击点赞（心在点的地方冒出来）
  let lastTap = 0, tapTimer = null;
  el.addEventListener('click', e => {
    if (e.target.closest('.actions,.info,.progress-wrap')) return;
    if (Date.now() - soundJustOn < 800) return;
    const now = Date.now();
    if (now - lastTap < 280) {
      clearTimeout(tapTimer);
      like(true, e.clientX, e.clientY);
    } else {
      tapTimer = setTimeout(togglePlay, 280);
    }
    lastTap = now;
  });
  function togglePlay() {
    const v = vid();
    if (!v) return;
    if (v.paused) { v.play().catch(() => {}); playInd.classList.remove('show'); }
    else { v.pause(); playInd.classList.add('show'); }
  }
  function like(only, x, y) {
    const on = only ? true : !liked.has(id);
    if (on) liked.add(id); else liked.delete(id);
    saveSet('liked', liked);
    likeBtn.classList.toggle('on', on);
    likeBtn.querySelector('.act-label').textContent = on ? '已赞' : '赞';
    if (x != null) {
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      heart.classList.remove('animate'); void heart.offsetWidth; heart.classList.add('animate');
    }
  }
  likeBtn.onclick = e => { e.stopPropagation(); like(false); };
  favBtn.onclick = e => {
    e.stopPropagation();
    const on = !faved.has(id);
    if (on) faved.add(id); else faved.delete(id);
    saveSet('faved', faved);
    favBtn.classList.toggle('on', on);
    favBtn.querySelector('.act-label').textContent = on ? '已收藏' : '收藏';
    toast(on ? '已收藏' : '取消收藏');
  };
  $('.comment-btn').onclick = e => { e.stopPropagation(); toast('评论还没开放'); };
  $('.share-btn').onclick = e => {
    e.stopPropagation();
    const url = `${location.origin}${location.pathname}?v=${item.id}`;
    if (navigator.share) navigator.share({ title: item.caption ? String(item.caption).slice(0, 40) : '小橘抖音', url }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('链接已复制'));
  };
  muteBtn.onclick = e => {
    e.stopPropagation();
    const v = vid();
    const muted = v ? !v.muted : soundOn;
    if (v) v.muted = muted;
    if (!muted) enableSound(); else soundOn = false;
    POOL.forEach(x => { x.muted = muted; });
    document.querySelectorAll('.slide .mute-btn').forEach(b => setMute(b, muted));
  };
  return el;
}

async function loadMore(reset = false, prefetched = null) {
  if (state.loading) return;
  if (reset) {
    state.offset = 0; state.items = [];
    POOL.forEach(v => { v.pause(); v._slide = null; v.removeAttribute('src'); v.load(); });
    feed.innerHTML = ''; currentVideo = null; cur = -1;
    feed.scrollTop = 0;
  }
  state.loading = true;
  if (reset) showStatus();
  try {
    const data = prefetched || await fetchList(state.offset, state.limit, state.q);
    state.total = data.total;
    let items = data.items;
    if (state.mode === 'rec' && !state.q) {  // 推荐：这一批里没看过的排前面
      items = [...items.filter(x => !seen.has(String(x.id))), ...items.filter(x => seen.has(String(x.id)))];
    }
    for (const item of items) {
      state.items.push(item);
      const slide = createSlide(item);
      slide.dataset.index = state.items.length - 1;
      feed.appendChild(slide);
    }
    state.offset += data.items.length;
    if (!state.items.length) showStatus(state.q ? `没搜到「${state.q}」相关的视频` : '还没有视频', true);
    else hideStatus();
    if (cur < 0 && state.items.length) goTo(0); else markNear();
  } catch (e) {
    console.error(e);
    if (state.items.length) toast('网络不给力，请稍后重试');
    else showStatus('网络不给力，轻点重试', true);
  } finally { state.loading = false; }
}
function showStatus(text, final) {
  let s = document.getElementById('global-status');
  if (!s) { s = document.createElement('div'); s.id = 'global-status'; s.className = 'status'; document.body.appendChild(s); }
  s.innerHTML = final ? `<div>${escapeHtml(text)}</div>` : `<div class="dy-loader spin"><i></i><i></i></div>`;
  s.onclick = final ? () => loadMore(state.items.length === 0) : null;
}
function hideStatus() { const s = document.getElementById('global-status'); if (s) s.remove(); }

// 播放器池：只有三个 <video>，眼前这页和后面两页轮着用（第 i 页用第 i % 3 个）。
// 苹果手机上播放器要被手指「解锁」过才能带声音自动播，每页一个新播放器的话第二页就得再点一下
let currentVideo = null;
const POOL = [0, 1, 2].map(() => {
  const v = document.createElement('video');
  v.loop = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');
  v.muted = true;
  v.preload = 'auto';
  ['playing', 'timeupdate', 'error', 'waiting', 'canplay'].forEach(ev => v.addEventListener(ev, () => {
    const s = v._slide;
    if (s && s._on && s._on[ev]) s._on[ev](v);
  }));
  return v;
});
function lend(slide) {
  if (!slide || !slide.classList.contains('slide')) return null;
  const v = POOL[Number(slide.dataset.index) % POOL.length];
  if (v._slide !== slide) {
    if (v._slide) { v.pause(); v._slide._video = null; v._slide.classList.remove('waiting'); v._slide.querySelector('.poster').style.opacity = '1'; }
    v._slide = slide;
    slide._video = v;
    slide.dataset.retried = '0';
    slide.querySelector('.video-wrap').insertBefore(v, slide.querySelector('.shade-top'));
    v.poster = API.thumb(slide.dataset.id);
    v.src = API.stream(slide.dataset.id);
  }
  return v;
}
function activate(idx) {
  const slide = feed.children[idx];
  if (!slide) return;
  const video = lend(slide);
  if (currentVideo && currentVideo !== video) currentVideo.pause();
  currentVideo = video;
  markSeen(slide.dataset.id);
  video.muted = !soundOn;
  setMute(slide.querySelector('.mute-btn'), video.muted);
  if (video.readyState < 3) slide.classList.add('waiting');
  // 万一还是被拦（没解锁过），先静音播着，别停在那儿等人点
  video.play().catch(() => { video.muted = true; setMute(slide.querySelector('.mute-btn'), true); video.play().catch(() => {}); });
  slide.querySelector('.play-indicator').classList.remove('show');
  if (idx >= state.items.length - 4 && state.items.length < state.total) loadMore();
}
// 预热：苹果手机不管 preload，暂停着的视频一个字节都不下，翻过去才开始加载，看着就像卡住了。
// 静音的视频允许自动播：先静音播一下，出了第一帧就停，数据和首帧都备好了，翻过去立刻接着播
let warmTimer = 0;
function warm(slide) {
  const v = lend(slide);
  if (!v || v === currentVideo || v.readyState >= 3) return;
  v.muted = true;
  const p = v.play();
  if (p) p.then(() => { if (v !== currentVideo) v.pause(); }).catch(() => {});
}

// ── 上下翻：浏览器原生滚动 + 吸附，JS 只管「现在是第几条」（参考 doomscroller） ──
// 滚动时每帧最多算一次：过了半屏就换成下一条播（新视频先播起来）；停稳在整页上之后，
// 把离开的视频倒回开头（翻回去从头播，跟抖音一样），再预热前后两条
let cur = -1;               // 眼前是第几条
let refreshing = false;     // 正在刷新
let H = feed.clientHeight || window.innerHeight;
const LOCK = 10;            // 手指先走出 10px 才算拖
// 只让眼前前后各两条把内容画出来，其余只剩黑底（还在页面里，点赞状态等都留着）
function markNear() {
  const kids = feed.children;
  for (let i = Math.max(0, cur - 4); i <= Math.min(kids.length - 1, cur + 4); i++) kids[i].classList.toggle('near', Math.abs(i - cur) <= 2);
}
function setCur(i) {
  if (i === cur) return;
  cur = i;
  markNear();
  activate(i);
}
function settle(i) {
  setCur(i);
  clearTimeout(warmTimer);
  warmTimer = setTimeout(() => {
    if (cur !== i) return;
    POOL.forEach(v => { if (v !== currentVideo && v.currentTime > 1) v.currentTime = 0; });
    warm(feed.children[i + 1]);
    warm(feed.children[i - 1]);
  }, 120);
}
// 跳到第 i 条：smooth 是键盘上下键那种平滑滚过去，否则直接到
function goTo(i, smooth) {
  const n = feed.children.length;
  if (!n) return;
  i = Math.max(0, Math.min(n - 1, i));
  if (smooth) { feed.scrollTo({ top: i * H, behavior: 'smooth' }); return; }
  feed.scrollTop = i * H;
  settle(i);
}
let raf = 0, idle = 0;
function onScroll() {
  raf = 0;
  const n = feed.children.length;
  if (!n) return;
  const p = feed.scrollTop / H;
  const i = Math.max(0, Math.min(n - 1, Math.round(p)));
  if (Math.abs(p - i) < 0.01) settle(i); else setCur(i);
}
feed.addEventListener('scroll', () => {
  if (!raf) raf = requestAnimationFrame(onScroll);
  clearTimeout(idle);
  idle = setTimeout(() => settle(Math.max(0, Math.min(feed.children.length - 1, Math.round(feed.scrollTop / H)))), 150);  // 兜底：滚动停了
}, { passive: true });
window.addEventListener('resize', () => {
  H = feed.clientHeight || window.innerHeight;
  if (cur >= 0) feed.scrollTop = cur * H;
});

// ── 下拉刷新（抖音首页）：第一条往下拉，视频不动，整条顶栏跟着手指往下走、淡出，「下拉刷新内容」淡入 ──
// 只听不拦（passive），不影响滚动；顶栏最多走 60px，拉过 70px 松手就刷新
const topbar = document.querySelector('.topbar'), pullNotice = document.getElementById('pullNotice');
const PULL_MAX = 60, PULL_GO = 70;
function setHeader(m, animate) {
  const y = Math.min(PULL_MAX, Math.max(0, m));
  for (const el of [topbar, pullNotice]) {
    el.style.transition = animate ? 'transform .3s, opacity .3s' : 'none';
    el.style.transform = y ? `translate3d(0,${y}px,0)` : '';
  }
  topbar.style.opacity = y ? String(Math.max(0, 1 - y / (PULL_MAX / 2))) : '';
  pullNotice.style.opacity = String(Math.max(0, Math.min(1, y / (PULL_MAX / 2) - 0.5)));
}
let pull = null;
feed.addEventListener('touchstart', e => {
  pull = e.touches.length === 1 && feed.scrollTop <= 0 && !refreshing
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, m: 0 } : null;
}, { passive: true });
feed.addEventListener('touchmove', e => {
  if (!pull) return;
  const dx = e.touches[0].clientX - pull.x, dy = e.touches[0].clientY - pull.y;
  if (feed.scrollTop > 0 || (!pull.m && Math.abs(dx) > Math.abs(dy))) {  // 其实是往上翻或者横着滑
    if (pull.m) setHeader(0, true);
    pull = null;
    return;
  }
  const m = Math.max(0, dy - LOCK);
  if (m === pull.m) return;  // 往上滑的时候一直是 0，不用反复改样式
  pull.m = m;
  setHeader(m);
}, { passive: true });
function endPull() {
  if (!pull) return;
  const go = pull.m >= PULL_GO;
  pull = null;
  setHeader(0, true);
  if (go) refresh();
}
feed.addEventListener('touchend', endPull, { passive: true });
feed.addEventListener('touchcancel', endPull, { passive: true });

// 左滑清屏，右滑恢复（横着滑才算，竖着滑照常切视频）
let sx = 0, sy = 0;
feed.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
feed.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const clean = dx < 0;
  if (document.body.classList.contains('clean') === clean) return;
  document.body.classList.toggle('clean', clean);
  toast(clean ? '已清屏，右滑恢复' : '已恢复');
}, { passive: true });

// ── 刷新：第一条视频往下拉，或者再点一下当前的「推荐/最新」；转圈的是右上角的两个点 ──
async function refresh() {
  if (refreshing || state.loading) return;
  refreshing = true;
  document.body.classList.add('refreshing');
  const oldSeed = state.seed;
  state.seed = Math.floor(Math.random() * 1e9);  // 推荐：换一批
  try {
    const [data] = await Promise.all([
      fetchList(0, state.limit, state.q),
      new Promise(r => setTimeout(r, 500)),  // 两个点至少转一会儿，别一闪而过
    ]);
    await loadMore(true, data);
  } catch {
    state.seed = oldSeed;
    toast('网络不给力，请稍后重试');
  } finally {
    refreshing = false;
    document.body.classList.remove('refreshing');
  }
}

document.addEventListener('keydown', e => {
  if (searchPage.classList.contains('show')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    goTo(cur + (e.key === 'ArrowDown' ? 1 : -1), true);
  }
  if (e.key === ' ' && currentVideo) { e.preventDefault(); if (currentVideo.paused) currentVideo.play().catch(() => {}); else currentVideo.pause(); }
});

(async function init() {
  try { const h = await fetch(API.health()); if (h.ok) setStatus(true, '云在线'); } catch { /* fetchList 里再判 */ }
  loadMore(true);
})();
</script>
</body>
</html>
