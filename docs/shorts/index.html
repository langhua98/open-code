<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>小橘抖音</title>
<meta name="apple-mobile-web-app-title" content="小橘抖音" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/png" sizes="192x192" href="xjdy-192.png" />
<link rel="shortcut icon" href="xjdy-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="xjdy-180.png" />
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="xjdy-180.png" />
<link rel="manifest" href="xjdy.webmanifest" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--accent:#fe2c55;--accent2:#25f4ee;--dim:rgba(255,255,255,.65)}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* 顶部：中间「推荐 / 最新」，左边在线状态，右边搜索 —— 照抖音 */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));pointer-events:none}
  .topbar > *{pointer-events:auto}
  .tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:22px;font-size:17px;font-weight:600}
  .tab{color:var(--dim);padding:4px 0;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .tab.on{color:#fff}
  .tab.on::after{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:#fff}
  .api-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
  .icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  /* 右上角：「连播」开关 + 搜索。关着是半透明描边小胶囊，开了变成红色 */
  .top-right{display:flex;align-items:center;gap:6px}
  .auto-btn{display:flex;align-items:center;gap:4px;height:26px;padding:0 10px 0 8px;border-radius:13px;font-size:12px;font-weight:600;color:var(--dim);
    background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.3);text-shadow:0 1px 2px rgba(0,0,0,.4);transition:background .2s,color .2s,border-color .2s}
  .auto-btn svg{width:14px;height:14px}
  .auto-btn.on{color:#fff;background:var(--accent);border-color:var(--accent);text-shadow:none}

  /* 搜索页：点放大镜才出来 */
  .search-page{position:fixed;inset:0;z-index:90;background:#111;display:none;flex-direction:column;
    padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top))}
  .search-page.show{display:flex}
  .search-row{display:flex;align-items:center;gap:10px}
  .search-box{flex:1;display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:8px;padding:9px 12px}
  .search-box input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:15px}
  .search-go{color:var(--accent);font-size:15px;font-weight:600}
  .search-hint{margin-top:18px;font-size:13px;color:#888}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .chip{font-size:13px;color:#ddd;background:#222;border-radius:999px;padding:6px 12px}

  /* 上下翻：交给浏览器原生滚动 + 吸附（参考 GitHub 上的 doomscroller）。手指拖动、惯性、吸附都由浏览器做，
     苹果手机上在系统的滚动线程里跑，页面 JS 再忙也不掉帧；snap-stop:always 让甩得再猛也只翻一条，跟抖音一样。
     第一条往下拉不回弹（overscroll none），留给下拉刷新；离得远的视频只留个黑底，里面的东西不画 */
  .feed{position:fixed;inset:0;overflow-x:hidden;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:none;touch-action:pan-y;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .slide{position:relative;height:100%;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
  .slide:not(.near) > *{display:none}

  /* 抖音的加载动画：青、红两个点来回交换，叠在一起的地方变暗 */
  .dy-loader{position:relative;width:34px;height:12px;isolation:isolate}
  .dy-loader i{position:absolute;top:0;left:11px;width:12px;height:12px;border-radius:50%;mix-blend-mode:multiply}
  .dy-loader i:first-child{background:#25f4ee;transform:translateX(-9px)}
  .dy-loader i:last-child{background:#fe2c55;transform:translateX(9px)}
  .dy-loader.spin i:first-child{animation:dyA .4s ease-in-out infinite alternate}
  .dy-loader.spin i:last-child{animation:dyB .4s ease-in-out infinite alternate}
  @keyframes dyA{from{transform:translateX(-9px) scale(1)}to{transform:translateX(9px) scale(1.2)}}
  @keyframes dyB{from{transform:translateX(9px) scale(1)}to{transform:translateX(-9px) scale(1.2)}}

  /* 下拉刷新（抖音首页）：第一条往下拉时视频不动，整条顶栏跟着手指往下走、淡出，
     「下拉刷新内容」淡入；松手刷新时顶栏回原位，右上角的搜索换成两个点在转 */
  .pull-notice{position:fixed;top:0;left:0;right:0;z-index:49;display:flex;justify-content:center;
    padding-top:calc(max(10px, env(safe-area-inset-top)) + 14px);font-size:16px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);opacity:0;pointer-events:none}
  .top-loading{width:36px;height:36px;display:none;align-items:center;justify-content:center}
  body.refreshing #searchOpen{display:none}
  body.refreshing .top-loading{display:flex}
  /* 视频卡住在缓冲：进度条位置一根白线从中间往两边散开 */
  .buffer-line{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));height:2px;z-index:7;overflow:hidden;display:none;pointer-events:none}
  .slide.no-related .buffer-line{bottom:env(safe-area-inset-bottom)}
  .buffer-line::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;transform:scaleX(0);animation:bufLine .9s ease-out infinite}
  @keyframes bufLine{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:0}}
  .slide.waiting:not(.paused) .buffer-line{display:block}
  .slide.waiting .progress-track{opacity:0}
  .video-wrap{position:absolute;inset:0}
  .video-wrap video,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
  .poster{transition:opacity .4s}
  .shade-top{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);pointer-events:none}
  .shade-bottom{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);pointer-events:none}

  /* 右边一列：头像、赞、评论、收藏、声音、分享 */
  .actions{position:absolute;right:6px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px}
  /* 图标用 Phosphor Icons（MIT）的实心款：圆润、厚实，跟抖音一个路子。颜色走 currentColor，点亮时整颗变色；
     阴影两层：一层贴边的淡实影 + 一层很淡的晕，白底视频上也看得清，又不像以前那样一圈黑边 */
  .act{display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;color:#fff}
  .act-icon{position:relative;width:44px;height:40px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.28)) drop-shadow(0 0 8px rgba(0,0,0,.16));transition:transform .18s cubic-bezier(.3,1.5,.6,1)}
  .act-icon svg{width:38px;height:38px;display:block;transition:color .2s}
  .act:active .act-icon{transform:scale(.86)}
  .act-label{font-size:12px;font-weight:500;letter-spacing:.3px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .like-btn.on .act-icon{color:var(--accent)}
  .fav-btn.on .act-icon{color:#ffc300}
  /* 点亮那一下：先缩小再弹大回来（照抖音），外面扩一圈同色的光圈；取消时轻轻一缩 */
  .act.pop .act-icon svg{animation:actPop .42s cubic-bezier(.3,1.6,.5,1)}
  @keyframes actPop{0%{transform:scale(.55)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
  .act.pop .act-icon::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    border:2px solid currentColor;opacity:0;animation:actRing .5s ease-out}
  @keyframes actRing{0%{transform:scale(.4);opacity:.85}100%{transform:scale(1.5);opacity:0}}
  .act.unpop .act-icon svg{animation:actUnpop .25s ease-out}
  @keyframes actUnpop{40%{transform:scale(.8)}}
  /* 头像：白边圆头像，下面红色「+」；点「+」转一圈变成白底红勾，再缩没（照抖音的关注动画） */
  .avatar{width:48px;height:48px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;
    position:relative;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .follow-plus{position:absolute;bottom:-10px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center}
  .follow-plus svg{width:12px;height:12px}
  .follow-plus .ck,.author-btn.followed .follow-plus .pl{display:none}
  .author-btn.followed .follow-plus .ck{display:block}
  .author-btn.followed .follow-plus{animation:followed .9s forwards}
  .author-btn.followed.done .follow-plus{display:none}
  @keyframes followed{0%{transform:rotate(0) scale(1)}40%{transform:rotate(360deg) scale(1);background:#fff;color:var(--accent)}
    75%{transform:rotate(360deg) scale(1);background:#fff;color:var(--accent)}100%{transform:rotate(360deg) scale(0);background:#fff;color:var(--accent)}}

  /* 左下：@作者、文案（#话题高亮，可点） */
  .info{position:absolute;left:0;right:76px;bottom:calc(46px + env(safe-area-inset-bottom));z-index:5;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
  .author{font-size:16px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);align-self:flex-start}
  .caption{font-size:14px;line-height:1.45;text-shadow:0 1px 3px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .caption.expanded{-webkit-line-clamp:unset}
  .caption .tag{font-weight:600}
  .more{font-size:13px;font-weight:600;color:var(--dim);align-self:flex-start}
  .meta{font-size:12px;color:var(--dim)}

  .progress-wrap{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));height:14px;z-index:7;display:flex;align-items:flex-end;cursor:pointer}
  .progress-track{width:100%;height:2px;background:rgba(255,255,255,.25)}
  .progress-bar{height:100%;width:0%;background:rgba(255,255,255,.85)}
  .slide.no-related .progress-wrap{bottom:env(safe-area-inset-bottom)}
  .slide.no-related .info{bottom:calc(10px + env(safe-area-inset-bottom))}
  .slide.no-related .actions{bottom:calc(84px + env(safe-area-inset-bottom))}
  .time-tip{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;font-size:22px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);display:none}
  .time-tip.show{display:block}

  /* 暂停时中间的大三角：跟着视频真的停没停走，出现时从大缩回来（照抖音） */
  .play-indicator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.4);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:6}
  .slide.paused .play-indicator{opacity:.85;transform:translate(-50%,-50%) scale(1)}
  .slide.paused .buffer-line{display:none}
  /* 静音按钮：两种图标都在，按 body.muted 显示一个，所有视频的按钮永远一致 */
  body.muted .mute-btn .when-on,body:not(.muted) .mute-btn .when-off{display:none}
  /* 双击的大红心：在点的地方从大往回一砸，随机歪一点，停一下再往上飘、变大、淡出（照抖音） */
  .heart-burst{position:absolute;--rot:-12deg;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:20;opacity:0;filter:drop-shadow(0 4px 10px rgba(254,44,85,.35))}
  .heart-burst.animate{animation:heartPop .95s ease forwards}
  @keyframes heartPop{
    0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.7);opacity:0}
    14%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(.92);opacity:1}
    26%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}
    62%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);opacity:1}
    100%{transform:translate(-50%,-160%) rotate(var(--rot)) scale(1.9);opacity:0}}
  .slide-error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.6);font-size:13px}
  .slide-error.show{display:block}
  .status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);z-index:40;text-align:center;padding:24px}

  /* 清屏：左滑把按钮和文字都藏起来，右滑恢复 */
  body.clean .topbar,body.clean .actions,body.clean .info,body.clean .shade-top,body.clean .shade-bottom{opacity:0;pointer-events:none}
  .topbar,.actions,.info{transition:opacity .25s}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:95;padding:9px 16px;border-radius:8px;background:rgba(0,0,0,.75);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  .search-banner{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:8px;
    background:rgba(0,0,0,.55);border-radius:999px;padding:6px 6px 6px 12px;font-size:13px;max-width:86vw}
  .search-banner.show{display:flex}
  .search-banner span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .search-banner button{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
  @media (min-width:768px){.video-wrap video,.poster{object-fit:contain}}

  /* 作者主页（照抖音）：点视频上的头像或作者名打开，头像、名字、作品数、关注，下面三列封面，点哪条从哪条开始刷他的视频 */
  .profile-page{position:fixed;inset:0;z-index:90;background:#161616;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .profile-page.show{display:flex}
  .pf-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;padding:6px 8px;padding-top:max(6px, env(safe-area-inset-top));background:#161616}
  .pf-head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 16px 18px}
  .pf-avatar{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.85)}
  .pf-name{font-size:19px;font-weight:700;margin-top:4px;text-align:center;word-break:break-all}
  .pf-count{font-size:13px;color:#999}
  .pf-actions{display:flex;gap:10px;margin-top:8px}
  .pf-follow{min-width:132px;height:36px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
  .pf-follow.done{background:#333;color:#bbb}
  .pf-ext{height:36px;padding:0 14px;border-radius:6px;background:#2a2a2a;color:#ddd;font-size:13px}
  .pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .pf-cell{position:relative;display:block;padding:0;aspect-ratio:3/4;background:#222;overflow:hidden}
  .pf-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .pf-cell span{position:absolute;left:6px;bottom:4px;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  .pf-more{padding:18px;text-align:center;color:#777;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <div class="api-badge" id="apiBadge" title="点一下切换 Worker 地址"><span class="dot" id="apiDot"></span><span id="apiStatus">连接中</span></div>
  <div class="tabs">
    <button class="tab on" data-mode="rec">推荐</button>
    <button class="tab" data-mode="new">最新</button>
  </div>
  <div class="top-right">
    <button class="auto-btn" id="autoBtn" aria-pressed="false" aria-label="自动连播"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M252,128a60,60,0,0,1-102.43,42.43l-.49-.53L89.22,102.31a36,36,0,1,0,0,51.38l3.08-3.48a12,12,0,1,1,18,15.91l-3.35,3.78-.49.53a60,60,0,1,1,0-84.86l.49.53,59.86,67.59a36,36,0,1,0,0-51.38l-3.08,3.48a12,12,0,1,1-18-15.91l3.35-3.78.49-.53A60,60,0,0,1,252,128Z"/></svg>连播</button>
    <button class="icon-btn" id="searchOpen" aria-label="搜索"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="top-loading"><div class="dy-loader spin"><i></i><i></i></div></div>
  </div>
</div>
<div class="search-banner" id="searchBanner"><span id="searchBannerText"></span><button id="searchClear">清除</button></div>

<div class="search-page" id="searchPage">
  <div class="search-row">
    <button class="icon-btn" id="searchBack" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="qInput" placeholder="搜作者、文案、#话题" enterkeyhint="search" />
    </div>
    <button class="search-go" id="searchGo">搜索</button>
  </div>
  <div class="search-hint">最近搜过</div>
  <div class="chips" id="historyChips"></div>
</div>

<div class="profile-page" id="profilePage">
  <div class="pf-top"><button class="icon-btn" id="profileBack" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="pf-head">
    <div class="pf-avatar" id="pfAvatar"></div>
    <div class="pf-name" id="pfName"></div>
    <div class="pf-count" id="pfCount"></div>
    <div class="pf-actions"><button class="pf-follow" id="pfFollow"></button><button class="pf-ext" id="pfExt">抖音主页</button></div>
  </div>
  <div class="pf-grid" id="pfGrid"></div>
  <div class="pf-more" id="pfMore"></div>
</div>

<div class="pull-notice" id="pullNotice">下拉刷新内容</div>
<div class="feed" id="feed"></div>
<div class="toast" id="toast"></div>

<script>
/** 视频服务地址：页面就在视频服务上时用同一个地址；也可以 ?api=https://xxx.workers.dev 指定一次（会记住） */
const qs = new URLSearchParams(location.search);
// 排查用：?debug=1 左上角显示播放器状态；?noblob=1 不预先整条下载到内存，全走网络播
const BUILD = '2026-10-10c', DEBUG = qs.get('debug') === '1', NO_BLOB = qs.get('noblob') === '1';
const STATS = { made: 0, srcs: 0, heals: 0, errors: [] };
if (qs.get('api')) localStorage.setItem('worker_base', qs.get('api').replace(/\/$/, ''));
const SAME_ORIGIN = /workers\.dev$/.test(location.hostname) ? location.origin : '';

// 本机记的东西（点赞、收藏、搜索记录）：私密模式下读写会出错，出错就当没有
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k) || '';
    localStorage.setItem(k, v);
  } catch { return ''; }
}
function storeSet(k) { try { return new Set(JSON.parse(store(k) || '[]')); } catch { return new Set(); } }

// 两件事分开记：

let unlocked = false;

// 翻页时 play() 被打断（AbortError）是正常的，不当回事
function playSafe(v) {
  v.muted = shouldMute();
  const p = v.play();
  if (p) p.catch(err => {
    if (!err || err.name !== 'NotAllowedError' || v.muted || v !== currentVideo) return;
    unlocked = false;
    document.body.classList.add('muted');
    v.muted = true;
    v.play().catch(() => {});
  });
}
function applyMute() {
  const m = shouldMute();
  document.body.classList.toggle('muted', m);
  if (currentVideo) currentVideo.muted = m;  // 只动眼前这条；前后在热身的永远静音，免得冒一声
}

// 手指碰屏幕时解锁：苹果手机只让「手指碰屏幕那一刻 play() 过」的播放器带声音播，趁这一下把池子里三个都 play 一遍。
// 不在眼前的静音着 play 再停；眼前这条按你要不要声音来。浏览器不认这一下（比如只是滑动结束）就退回静音接着播，下次再试。
// 只做解锁，不吞掉这次点击：点视频照样暂停，点按钮照样生效
function unlock() {
  if (unlocked) return;
  const cv = currentVideo;
  POOL.forEach(v => { if (v !== cv) silentPlay(v); });
  if (!cv) return;
  const wasPaused = cv.paused;
  cv.muted = wasPaused || !wantSound;  // 你暂停着的，静音着解锁，别冒一声
  const p = cv.play();
  if (!p) return;
  p.then(() => {
    unlocked = true;
    if (wasPaused && cv._slide && cv._slide._userPaused) cv.pause();  // 本来是你暂停的，解锁完还停着
    applyMute();
  }).catch(() => {
    cv.muted = true;
    if (wasPaused || cv !== currentVideo) cv.pause(); else cv.play().catch(() => {});
  });
}

function openProfile(author) {

  pf = { author, items: [], total: 0, loading: false, done: false, gen: (pf ? pf.gen : 0) + 1 };

  const av = document.getElementById('pfAvatar');

  pfGrid.innerHTML = '';

  profilePage.scrollTop = 0;
  profilePage.classList.add('show');
  if (currentVideo && !currentVideo.paused) { currentVideo.pause(); pf.resume = true; }  // 主页盖住视频时先停下
  loadProfile();
}
function closeProfile(resume = true) {
  profilePage.classList.remove('show');
  if (resume && pf && pf.resume && currentVideo && currentVideo._slide && !currentVideo._slide._userPaused) playSafe(currentVideo);
}
async function loadProfile() {
  const p = pf;
  if (!p || p.loading || p.done) return;
  p.loading = true;
  pfMore.textContent = '加载中…';
  try {
    const data = await fetchList(p.items.length, 30, '', p.author);
    if (p !== pf) return;  // 中途换了别的作者
    p.total = data.total;
    for (const it of data.items) {
      const i = p.items.push(it) - 1;
      const c = document.createElement('button');
      c.className = 'pf-cell';
      c.innerHTML = `<img src="${API.thumb(it.id)}" alt="" loading="lazy" /><span>${it.duration ? fmtTime(it.duration) : ''}</span>`;
      c.onclick = () => playAuthor(i);
      pfGrid.appendChild(c);
    }
    p.done = p.items.length >= p.total || !data.items.length;
    document.getElementById('pfCount').textContent = `${p.total} 个作品`;
    pfMore.textContent = p.done ? (p.total ? '没有更多了' : '还没有作品') : '';
  } catch {
    if (p === pf) pfMore.textContent = '网络不给力，下拉到底再试';
  } finally { p.loading = false; }
}

}

  toastEl.textContent = text;

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtTime(s) { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function avatarColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 55% 42%)`;
}
// 文案：#话题 变成能点的高亮，点了按它搜；去掉末尾我们自己加的 #dy… / #ks… 编号
function captionHtml(text) {
  const clean = String(text || '').replace(/\s*#(dy|ks)[0-9A-Za-z_-]{6,}\s*$/, '').trim();
  return escapeHtml(clean).replace(/#([^\s#@]+)/g, (m, t) => `<span class="tag" data-q="#${t}">#${t}</span>`);
}

async function fetchList(offset, limit, q, author = state.author) {
  try {
    const seed = state.mode === 'rec' && !q && !author ? state.seed : null;
    const res = await fetch(API.list(offset, limit, q, seed, author), { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.items)) throw new Error('bad format');
    setStatus(true, '云在线');
    return data;
  } catch (e) {
    setStatus(false, '离线');
    throw e;
  }
}

// 滚动时每帧最多算一次：过了半屏就换成下一条播（新视频先播起来）；停稳在整页上之后，
// 把离开的视频倒回开头（翻回去从头播，跟抖音一样），再预热前后两条
let cur = -1;               // 眼前是第几条
let refreshing = false;     // 正在刷新
let H = feed.clientHeight || window.innerHeight;
const LOCK = 10;            // 手指先走出 10px 才算拖
// 只让眼前前后各两条把内容画出来，其余只剩黑底（还在页面里，点赞状态等都留着）
function markNear() {
  const kids = feed.children;
  for (let i = Math.max(0, cur - 4); i <= Math.min(kids.length - 1, cur + 4); i++) {
    const near = Math.abs(i - cur) <= 2;
    kids[i].classList.toggle('near', near);
    if (near) kids[i].querySelector('.poster').loading = 'eager';  // 附近的封面马上加载，别等懒加载
  }
}
function setCur(i) {
  if (i === cur) return;
  cur = i;
  markNear();
  activate(i);
}
function settle(i) {
  setCur(i);
  clearTimeout(warmTimer);
  warmTimer = setTimeout(() => {
    if (cur !== i) return;
    POOL.forEach(v => { if (v !== currentVideo && v.currentTime > 1) v.currentTime = 0; });
    warm(feed.children[i - 1]);
    const next = feed.children[i + 1];
    if (next && (blobUrl(next.dataset.id) || !canPrefetch(state.items[i + 1]))) warm(next);
    prefetchAround(i);
  }, 120);
}
// 跳到第 i 条：smooth 是键盘上下键那种平滑滚过去，否则直接到
function goTo(i, smooth) {
  const n = feed.children.length;
  if (!n) return;
  i = Math.max(0, Math.min(n - 1, i));
  if (smooth) { feed.scrollTo({ top: i * H, behavior: 'smooth' }); return; }
  feed.scrollTop = i * H;
  settle(i);
}
let raf = 0, idle = 0;
function onScroll() {
  raf = 0;
  const n = feed.children.length;
  if (!n) return;
  const p = feed.scrollTop / H;
  const i = Math.max(0, Math.min(n - 1, Math.round(p)));
  if (Math.abs(p - i) < 0.01) settle(i); else setCur(i);
}
feed.addEventListener('scroll', () => {
  if (!raf) raf = requestAnimationFrame(onScroll);
  clearTimeout(idle);
  idle = setTimeout(() => settle(Math.max(0, Math.min(feed.children.length - 1, Math.round(feed.scrollTop / H)))), 150);  // 兜底：滚动停了
}, { passive: true });
window.addEventListener('resize', () => {
  H = feed.clientHeight || window.innerHeight;
  if (cur >= 0) feed.scrollTop = cur * H;
});

// ── 下拉刷新（抖音首页）：第一条往下拉，视频不动，整条顶栏跟着手指往下走、淡出，「下拉刷新内容」淡入 ──
// 只听不拦（passive），不影响滚动；顶栏最多走 60px，拉过 70px 松手就刷新
const topbar = document.querySelector('.topbar'), pullNotice = document.getElementById('pullNotice');
const PULL_MAX = 60, PULL_GO = 70;
function setHeader(m, animate) {
  const y = Math.min(PULL_MAX, Math.max(0, m));
  for (const el of [topbar, pullNotice]) {
    el.style.transition = animate ? 'transform .3s, opacity .3s' : 'none';
    el.style.transform = y ? `translate3d(0,${y}px,0)` : '';
  }
  topbar.style.opacity = y ? String(Math.max(0, 1 - y / (PULL_MAX / 2))) : '';
  pullNotice.style.opacity = String(Math.max(0, Math.min(1, y / (PULL_MAX / 2) - 0.5)));
}
let pull = null;
feed.addEventListener('touchstart', e => {
  pull = e.touches.length === 1 && feed.scrollTop <= 0 && !refreshing
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, m: 0 } : null;
}, { passive: true });
feed.addEventListener('touchmove', e => {
  if (!pull) return;
  const dx = e.touches[0].clientX - pull.x, dy = e.touches[0].clientY - pull.y;
  if (feed.scrollTop > 0 || (!pull.m && Math.abs(dx) > Math.abs(dy))) {  // 其实是往上翻或者横着滑
    if (pull.m) setHeader(0, true);
    pull = null;
    return;
  }
  const m = Math.max(0, dy - LOCK);
  if (m === pull.m) return;  // 往上滑的时候一直是 0，不用反复改样式
  pull.m = m;
  setHeader(m);
}, { passive: true });
function endPull() {
  if (!pull) return;
  const go = pull.m >= PULL_GO;
  pull = null;
  setHeader(0, true);
  if (go) refresh();
}
feed.addEventListener('touchend', endPull, { passive: true });
feed.addEventListener('touchcancel', endPull, { passive: true });

// 左滑清屏，右滑恢复（横着滑才算，竖着滑照常切视频）
let sx = 0, sy = 0;
feed.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
feed.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const clean = dx < 0;
  if (document.body.classList.contains('clean') === clean) return;
  document.body.classList.toggle('clean', clean);
  toast(clean ? '已清屏，右滑恢复' : '已恢复');
}, { passive: true });

// ── 自动连播（照抖音）：右上角「连播」打开后，视频不再循环，播完自动滑到下一条；开关记在本机 ──
let autoNext = store('auto_next') === '1', advanceFrom = -1;  // advanceFrom：在第几条播完时等下一批
const autoBtn = document.getElementById('autoBtn');
function renderAuto() {
  autoBtn.classList.toggle('on', autoNext);
  autoBtn.setAttribute('aria-pressed', String(autoNext));
  if (currentVideo) currentVideo.loop = !autoNext;  // 正在播的这条立刻生效
}
autoBtn.addEventListener('click', () => {
  autoNext = !autoNext;
  store('auto_next', autoNext ? '1' : '0');
  renderAuto();
  keepAwake(autoNext);
  toast(autoNext ? '已开启自动连播' : '已关闭自动连播');
});
function autoAdvance() {
  if (cur + 1 < feed.children.length) goTo(cur + 1, true);           // 平滑滑到下一条，跟手指滑一样
  else if (state.items.length < state.total) { advanceFrom = cur; loadMore(); }  // 下一批还没来：来了接着滑
  else if (currentVideo) { toast('没有更多视频了'); currentVideo.currentTime = 0; playSafe(currentVideo); }
}
renderAuto();
// 连播时不让屏幕自己熄灭（浏览器支持才有：苹果 16.4+、安卓 Chrome）；切回页面时重新申请
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      const w = wakeLock; wakeLock = null; await w.release();
    }
  } catch { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(autoNext); });
['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => { if (autoNext && !wakeLock) keepAwake(true); }, { passive: true }));

// ── 刷新：第一条视频往下拉，或者再点一下当前的「推荐/最新」；转圈的是右上角的两个点 ──
async function refresh() {
  if (refreshing || state.loading) return;
  refreshing = true;
  document.body.classList.add('refreshing');
  const oldSeed = state.seed;
  state.seed = Math.floor(Math.random() * 1e9);  // 推荐：换一批
  try {
    const [data] = await Promise.all([
      fetchList(0, state.limit, state.q),
      new Promise(r => setTimeout(r, 500)),  // 两个点至少转一会儿，别一闪而过
    ]);
    await loadMore(true, data);
  } catch {
    state.seed = oldSeed;
    toast('网络不给力，请稍后重试');
  } finally {
    refreshing = false;
    document.body.classList.remove('refreshing');
  }
}

document.addEventListener('keydown', e => {
  if (searchPage.classList.contains('show') || profilePage.classList.contains('show')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    goTo(cur + (e.key === 'ArrowDown' ? 1 : -1), true);
  }
  if (e.key === ' ' && currentVideo && currentVideo._slide) { e.preventDefault(); currentVideo._slide._toggle(); }
});

(async function init() {
  try { const h = await fetch(API.health()); if (h.ok) setStatus(true, '云在线'); } catch { /* fetchList 里再判 */ }
  loadMore(true);
})();
// ── 调试面板（?debug=1）：卡住的时候截图发过来，看是解码、加载还是内存的问题 ──
if (DEBUG) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:6px;top:56px;z-index:99;margin:0;padding:6px 8px;max-width:72vw;font:11px/1.35 ui-monospace,Menlo,monospace;color:#0f0;background:rgba(0,0,0,.7);border-radius:6px;pointer-events:none;white-space:pre-wrap';
  document.body.appendChild(box);
  setInterval(() => {
    const v = currentVideo, q = v && v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
    const nb = blobs.size;
    box.textContent = [
      `build ${BUILD}${NO_BLOB ? ' noblob' : ''}  第${cur + 1}条 id=${v && v._slide ? v._slide.dataset.id : '-'}`,
      v ? `src=${v.src.slice(0, 5)} rs=${v.readyState} ns=${v.networkState} ${v.paused ? '暂停' : '播放'}${v.muted ? ' 静音' : ''}` : 'no video',
      v ? `时间 ${v.currentTime.toFixed(1)}/${(v.duration || 0).toFixed(1)}  画面 ${v.videoWidth}x${v.videoHeight}` : '',
      v ? `解码帧 ${q ? q.totalVideoFrames : '?'} 丢 ${q ? q.droppedVideoFrames : '?'}  上一帧@${v._frameT == null ? '?' : v._frameT.toFixed(1)}` : '',
      `播放器 建${STATS.made} 换源${STATS.srcs} 自救${STATS.heals}  内存视频${nb} blobFails=${blobFails}`,
      `出错 ${STATS.errors.join(' | ') || '无'}`,
    ].join('\n');
  }, 500);
}
</script>
