<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Shorts - 抖音式短视频</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#000;--fg:#fff;--muted:#8a8a8e;--accent:#fe2c55;--accent2:#25f4ee}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  body{overflow:hidden}
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .search-wrap{
    flex:1;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.12);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;
    padding:8px 14px;transition:.2s;
  }
  .search-wrap:focus-within{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.2)}
  .search-wrap{min-width:0}
  .search-wrap input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
  .search-wrap input::placeholder{color:rgba(255,255,255,.5)}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);white-space:nowrap}
  .api-badge{
    display:flex;align-items:center;gap:6px;
    font-size:10px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.1);padding:6px 10px;border-radius:999px;backdrop-filter:blur(10px);
    cursor:pointer;white-space:nowrap;
  }
  .topbar{gap:8px}
  @media (max-width:520px){#apiStatus{display:none}}
  .slide-error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.6);font-size:13px;color:#fff;cursor:pointer}
  .slide-error.show{display:block}
  .dot{width:6px;height:6px;border-radius:50%;background:#25f4ee;box-shadow:0 0 8px #25f4ee;animation:pulse 2s infinite}
  .api-badge.on{border-color:var(--accent2);color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .feed{
    height:100vh;height:100dvh;width:100vw;
    overflow-y:scroll;overflow-x:hidden;
    scroll-snap-type:y mandatory;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .feed::-webkit-scrollbar{display:none}
  .slide{
    position:relative;height:100vh;height:100dvh;width:100vw;
    scroll-snap-align:start;scroll-snap-stop:always;
    background:#000;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .video-wrap{position:absolute;inset:0}
  .video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
  .gradient{position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.15) 30%, rgba(0,0,0,.25) 100%);pointer-events:none}
  .gradient-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg, rgba(0,0,0,.6), transparent);pointer-events:none}
  .actions{position:absolute;right:10px;bottom:120px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:20px}
  .action-btn{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .action-icon{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);transition:transform .15s, background .15s}
  .action-btn:active .action-icon{transform:scale(.9)}
  .action-btn.liked .action-icon{background:rgba(254,44,85,.25);border-color:rgba(254,44,85,.4)}
  .action-btn.liked svg{fill:#fe2c55;stroke:#fe2c55}
  .action-label{font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .follow-plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
  .info{position:absolute;left:0;right:68px;bottom:0;z-index:5;padding:16px;padding-bottom:max(20px, env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .user-row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .caption{font-size:14px;line-height:1.45;color:rgba(255,255,255,.95);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .caption.expanded{-webkit-line-clamp:unset}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;color:#fff;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.1)}
  .music{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.8)}
  .music-icon{animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-wrap{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:10;background:rgba(255,255,255,.2);cursor:pointer}
  .progress-bar{height:100%;background:#fff;transform-origin:left;width:0%;transition:width .1s linear}
  .progress-wrap:hover{height:8px}
  .progress-wrap:hover .progress-bar{background:var(--accent)}
  .play-indicator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;z-index:6;border:1px solid rgba(255,255,255,.15)}
  .play-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .heart-burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:20;opacity:0}
  .heart-burst.animate{animation:heartPop .9s cubic-bezier(.17,.89,.32,1.49) forwards}
  @keyframes heartPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1}40%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(1) translateY(-30px);opacity:0}}
  .ctrls{position:absolute;top:50%;left:12px;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px;opacity:0;transition:.2s}
  .slide:hover .ctrls, .slide:focus-within .ctrls{opacity:1}
  .ctrl-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.6);z-index:2}
  .spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @media (min-width:768px){.info{right:90px;padding-left:24px}.actions{right:18px}}
  #soundTip{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;white-space:nowrap;animation:pulse 2s infinite}
</style>
</head>
<body>

<div class="topbar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="qInput" placeholder="搜索文案 / #标签" />
    <span class="pill" id="countPill">0 视频</span>
  </div>
  <div class="api-badge on" id="shuffleBtn" title="点击切换 随机/顺序"><span id="shuffleTxt">🔀 随机</span></div>
  <div class="api-badge" id="apiBadge" title="点击切换 Worker 地址"><span class="dot" id="apiDot"></span><span id="apiStatus">连接中…</span></div>
</div>

<div class="feed" id="feed"></div>

<div id="soundTip">🔈 轻触屏幕开启声音</div>

<script>
/** =======================
 *  API 配置（已打通）
 *  默认同域；跨域部署时用 ?api=https://xxx.workers.dev 指定一次即可记住
 *  ======================= */
const qs = new URLSearchParams(location.search);
const savedBase = localStorage.getItem('worker_base') || '';
if (qs.get('api')) {
  localStorage.setItem('worker_base', qs.get('api').replace(/\/$/, ''));
}
const WORKER_BASE = (qs.get('api') || savedBase || 'https://xiaoju-shorts.langhua98.workers.dev').replace(/\/$/, '');

const API = {
  // 清单：GET /api/list?offset=0&limit=20&q=关键词&shuffle=1&seed=123 -> {total, items:[{id,caption,duration,size,date}]}
  list: (offset, limit, q, seed) => `${WORKER_BASE}/api/list?offset=${offset}&limit=${limit}&q=${encodeURIComponent(q||'')}` + (seed == null ? '' : `&shuffle=1&seed=${seed}`),
  // 播放：/stream/{id}.mp4 - worker 需回 206 + Range
  stream: (id) => `${WORKER_BASE}/stream/${id}.mp4`,
  // 封面：/thumb/{id}.jpg
  thumb: (id) => `${WORKER_BASE}/thumb/${id}.jpg`,
  // 健康检查：/api/health
  health: () => `${WORKER_BASE}/api/health`,
};

let state = { offset: 0, limit: 20, total: 0, q: "", loading: false, items: [], observers: new Map(), seed: Math.floor(Math.random() * 1e9) };

// 默认有声：浏览器只允许静音自动播，所以首次触碰屏幕时打开声音，之后所有视频都有声
let soundOn = false;
const ICON_SOUND = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
const ICON_MUTED = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
function setMuteIcon(btn, muted){ btn.innerHTML = muted ? ICON_MUTED : ICON_SOUND; }
function enableSound(){
  if (soundOn) return;
  soundOn = true;
  document.querySelectorAll('.slide video').forEach(v => { v.muted = false; });
  document.querySelectorAll('.slide .mute-btn').forEach(b => setMuteIcon(b, false));
  const tip = document.getElementById('soundTip');
  if (tip) tip.style.display = 'none';
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, enableSound, { passive: true }));

const feed = document.getElementById('feed');
const qInput = document.getElementById('qInput');
const countPill = document.getElementById('countPill');
const apiStatus = document.getElementById('apiStatus');
const apiDot = document.getElementById('apiDot');
const shuffleBtn = document.getElementById('shuffleBtn');
const shuffleTxt = document.getElementById('shuffleTxt');
function renderShuffleBtn(){
  const on = state.seed != null;
  shuffleBtn.classList.toggle('on', on);
  shuffleTxt.textContent = on ? '🔀 随机' : '🔀 顺序';
}
shuffleBtn.addEventListener('click', () => {
  state.seed = (state.seed == null) ? Math.floor(Math.random() * 1e9) : null;
  renderShuffleBtn();
  loadMore(true);
});
renderShuffleBtn();

document.getElementById('apiBadge').addEventListener('click', () => {
  const cur = localStorage.getItem('worker_base') || '';
  const v = prompt('Worker 地址（https://xxx.workers.dev，留空=同域）', cur);
  if (v === null) return;
  localStorage.setItem('worker_base', v.trim().replace(/\/$/, ''));
  location.reload();
});

function setStatus(ok, text) {
  apiStatus.textContent = text;
  apiDot.style.background = ok ? '#25f4ee' : '#fe2c55';
  apiDot.style.boxShadow = ok ? '0 0 8px #25f4ee' : '0 0 8px #fe2c55';
}

function debounce(fn, ms){let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a), ms)}}
function extractTags(caption){ return caption.match(/#[^\s#]+/g) || []; }

async function fetchList(offset, limit, q){
  try{
    const res = await fetch(API.list(offset, limit, q, state.seed), {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(!data || !Array.isArray(data.items)) throw new Error('bad format');
    setStatus(true, '已连接');
    return data;
  }catch(e){
    setStatus(false, '连不上');
    throw e;
  }
}

function createSlide(item){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.id = item.id;
  const tags = extractTags(item.caption||'');
  const cleanCap = item.caption||'';
  const meta = `${item.duration ? '⏱'+item.duration+'s · ' : ''}${item.size ? (item.size/1048576).toFixed(1)+'MB' : ''}${item.date ? ' · '+String(item.date).slice(0,10) : ''}`;
  el.innerHTML = `
    <div class="video-wrap">
      <img class="poster" src="${API.thumb(item.id)}" alt="" loading="lazy" />
      <video poster="${API.thumb(item.id)}" src="${API.stream(item.id)}" loop playsinline preload="metadata" muted></video>
      <div class="gradient"></div>
      <div class="gradient-top"></div>
    </div>
    <div class="ctrls">
      <div class="ctrl-btn mute-btn" title="静音/取消静音">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </div>
    </div>
    <div class="slide-error">视频加载失败，轻点重试</div>
    <div class="play-indicator"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v14l11-7-11-7z"/></svg></div>
    <div class="heart-burst"><svg width="88" height="88" viewBox="0 0 24 24" fill="#fe2c55" stroke="#fe2c55" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    <div class="actions">
      <div class="action-btn"><div class="avatar" style="display:flex;align-items:center;justify-content:center;background:#222;font-weight:700">橘<div class="follow-plus">+</div></div></div>
      <div class="action-btn like-btn" data-liked="0">
        <div class="action-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <div class="action-label">赞</div>
      </div>
      <div class="action-btn"><div class="action-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div class="action-label">评论</div></div>
      <div class="action-btn share-btn"><div class="action-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div><div class="action-label">分享</div></div>
    </div>
    <div class="info">
      <div class="user-row">@user_${item.id} <span style="font-weight:400;opacity:.6;font-size:12px">· id:${item.id}${meta ? ' · '+escapeHtml(meta) : ''}</span></div>
      <div class="caption">${escapeHtml(cleanCap)}</div>
      <div class="tags">${tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="music"><span class="music-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span> 原声 · @user_${item.id} 创作的原声</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
  `;

  const video = el.querySelector('video');
  const poster = el.querySelector('.poster');
  const progressWrap = el.querySelector('.progress-wrap');
  const progressBar = el.querySelector('.progress-bar');
  const playInd = el.querySelector('.play-indicator');
  const heart = el.querySelector('.heart-burst');
  const likeBtn = el.querySelector('.like-btn');
  const muteBtn = el.querySelector('.mute-btn');
  const captionEl = el.querySelector('.caption');
  const shareBtn = el.querySelector('.share-btn');

  // 新滑出的视频跟随全局声音状态（开声后不再静音）
  video.muted = !soundOn;
  setMuteIcon(muteBtn, video.muted);

  captionEl.addEventListener('click', ()=> captionEl.classList.toggle('expanded'));
  video.addEventListener('playing', ()=>{ poster.style.opacity='0'; });
  video.addEventListener('pause', ()=>{ if(video.currentTime===0) poster.style.opacity='1'; });
  video.addEventListener('timeupdate', ()=>{
    if(!video.duration) return;
    progressBar.style.width = ((video.currentTime / video.duration)*100)+'%';
  });
  // 第一次播放时 worker 要先去 Telegram 换 file_id，偶尔超时：自动重试一次，再失败就让用户点一下重试
  const errBox = el.querySelector('.slide-error');
  function reloadVideo(){
    errBox.classList.remove('show');
    video.src = API.stream(item.id) + '?retry=' + Date.now();
    if (video === currentVideo) video.play().catch(()=>{});
  }
  video.addEventListener('error', ()=>{
    if (!video.dataset.retried) { video.dataset.retried = '1'; setTimeout(reloadVideo, 1500); }
    else errBox.classList.add('show');
  });
  errBox.addEventListener('click', (e)=>{ e.stopPropagation(); reloadVideo(); });
  progressWrap.addEventListener('click', (e)=>{
    const rect = progressWrap.getBoundingClientRect();
    const pct = (e.clientX - rect.left)/rect.width;
    if(video.duration) video.currentTime = pct * video.duration;
  });

  let lastTap = 0;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.actions') || e.target.closest('.info') || e.target.closest('.ctrls') || e.target.closest('.progress-wrap')) return;
    const now = Date.now();
    if(now - lastTap < 300){ triggerLike(); } else { togglePlay(); }
    lastTap = now;
  });

  function togglePlay(){
    if(video.paused){ video.play().catch(()=>{}); playInd.classList.remove('show'); }
    else { video.pause(); playInd.classList.add('show'); setTimeout(()=>playInd.classList.remove('show'), 700); }
  }
  function triggerLike(){
    if(likeBtn.dataset.liked !== '1'){
      likeBtn.dataset.liked='1'; likeBtn.classList.add('liked');
      const label = likeBtn.querySelector('.action-label');
    }
    heart.classList.remove('animate'); void heart.offsetWidth; heart.classList.add('animate');
  }
  likeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); triggerLike(); });
  shareBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const url = API.stream(item.id);
    if (navigator.share) navigator.share({title: 'Shorts', url}).catch(()=>{});
    else if (navigator.clipboard) { navigator.clipboard.writeText(url); alert('链接已复制'); }
  });

  muteBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    video.muted = !video.muted;
    if (!video.muted) soundOn = true;
    setMuteIcon(muteBtn, video.muted);
  });

  el.addEventListener('mouseenter', ()=>{ if(video.preload==='metadata') video.preload='auto'; });
  return el;
}

function escapeHtml(s){return String(s).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function loadMore(reset=false){
  if(state.loading) return;
  if(reset){ state.offset=0; state.items=[]; feed.innerHTML=''; state.observers.forEach(o=>o.disconnect()); state.observers.clear(); }
  state.loading=true;
  showStatus();
  try{
    const data = await fetchList(state.offset, state.limit, state.q);
    state.total = data.total;
    countPill.textContent = `${state.total} 视频`;
    data.items.forEach(item=>{
      state.items.push(item);
      const slide = createSlide(item);
      slide.dataset.index = state.items.length-1;
      feed.appendChild(slide);
      observeSlide(slide);
    });
    state.offset += data.items.length;
    if(feed.scrollHeight <= window.innerHeight*1.2 && state.items.length < state.total){
      state.loading=false;
      return loadMore();
    }
    hideStatus();
  }catch(e){
    console.error(e);
    showStatus('连不上视频服务，轻点重试', true);
  }
  finally{ state.loading=false; }
}

function showStatus(text, retry){
  let s = document.getElementById('global-status');
  if(!s){ s=document.createElement('div'); s.id='global-status'; s.className='status'; feed.appendChild(s); }
  s.innerHTML = retry ? `<div>${text}</div>` : `<div class="spinner"></div><div>加载中...</div>`;
  s.onclick = retry ? ()=>loadMore(state.items.length === 0) : null;
}
function hideStatus(){ const s=document.getElementById('global-status'); if(s) s.remove(); }

let currentVideo = null;
function observeSlide(slide){
  const video = slide.querySelector('video');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio>0.7){
        if(currentVideo && currentVideo!==video){ currentVideo.pause(); }
        currentVideo = video;
        if (soundOn) video.muted = false;
        video.play().catch(()=>{});
        const idx = parseInt(slide.dataset.index);
        for(let i=1;i<=2;i++){
          const next = feed.children[idx+i];
          if(next){ const v=next.querySelector('video'); if(v) v.preload='auto'; }
        }
        if(idx >= state.items.length - 4 && state.items.length < state.total){ loadMore(); }
      }else if(entry.intersectionRatio<0.2){ video.pause(); }
    });
  }, {threshold:[0,0.2,0.7,1]});
  io.observe(slide);
  state.observers.set(String(slide.dataset.id), io);
}

qInput.addEventListener('input', debounce(()=>{ state.q = qInput.value.trim(); loadMore(true); }, 400));

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); scrollToSlide(1); }
  if(e.key==='ArrowUp'){ e.preventDefault(); scrollToSlide(-1); }
  if(e.key===' '){ e.preventDefault(); if(currentVideo){ if(currentVideo.paused) currentVideo.play(); else currentVideo.pause(); } }
});

function scrollToSlide(dir){
  const slides = [...feed.children].filter(n=>n.classList && n.classList.contains('slide'));
  if(!slides.length) return;
  const curIdx = Math.round(feed.scrollTop / window.innerHeight);
  const next = Math.max(0, Math.min(slides.length-1, curIdx + dir));
  slides[next].scrollIntoView({behavior:'smooth'});
}

// 启动：先 health 探一下，再拉清单
(async function init(){
  try {
    const h = await fetch(API.health());
    if (h.ok) setStatus(true, '已连接');
  } catch { /* fetchList 里会再判 */ }
  loadMore(true);
})();

window.ShortsAPI = {
  reload: (q)=>{ state.q=q||''; qInput.value=state.q; loadMore(true); },
  getConfig: ()=> ({WORKER_BASE, ...API}),
  getState: ()=> state,
};
